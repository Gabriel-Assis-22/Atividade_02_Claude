version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "8208:80"        # Porta reservada do aluno → Nginx
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8080"           # Só acessível internamente pelo Nginx
    env_file: .env       # Lê diretamente o .env existente na raiz
    restart: unless-stopped
