version: "3.8"

services:
  app:
    build: .
    ports:
      - "8208:3000"   # Porta reservada do aluno → porta interna do container
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=3000
    restart: unless-stopped
