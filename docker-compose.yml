networks:
  app-network:
    driver: bridge

services:
  frontend:
    build: ./frontend
    ports:
      - "8208:80"        # Único ponto de entrada público exposto no host
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8080"           # Apenas acessível internamente pelo Nginx / rede interna
    depends_on:
      - auth-service
      - log-service
      - garage-init
    environment:
      - TMDB_API_KEY
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - JWT_SECRET
      - AUTH_SERVICE_URL=http://auth-service:8081
      - LOG_SERVICE_URL=http://log-service:8082
      - ASPNETCORE_URLS=http://+:8080
      - GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_ACCESS_KEY
      - GARAGE_SECRET_KEY
      - GARAGE_BUCKET_NAME
      - GARAGE_PUBLIC_BASE_URL
      - MINIO_ENDPOINT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_BUCKET_NAME
      - MINIO_PUBLIC_BASE_URL
    networks:
      - app-network
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    expose:
      - "8081"           # Exclusivo rede interna Docker — NUNCA exposto ao host
    depends_on:
      - log-service
    environment:
      - MAILTRAP_API_TOKEN
      - MAILTRAP_INBOX_ID
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - JWT_SECRET
      - FRONTEND_URL=https://gabriel-assis-isw055.lapps.studio
      - LOG_SERVICE_URL=http://log-service:8082
      - ASPNETCORE_URLS=http://+:8081
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"           # Apenas rede interna Docker
    networks:
      - app-network
    restart: unless-stopped

  log-service:
    build: ./log-service
    expose:
      - "8082"           # Exclusivo rede interna Docker — NUNCA exposto ao host
    depends_on:
      - redis
    environment:
      - REDIS_CONNECTION=redis:6379
      - JWT_SECRET
      - ASPNETCORE_URLS=http://+:8082
    networks:
      - app-network
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.0.1
    command: /garage server
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose:
      - "3900"           # API S3 na rede interna Docker
      - "3902"           # Web S3 (acesso público) na rede interna Docker
    networks:
      - app-network
    restart: unless-stopped

  garage-init:
    build:
      context: ./garage
      dockerfile: Dockerfile
    depends_on:
      - garage
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      - GARAGE_ACCESS_KEY
      - GARAGE_SECRET_KEY
      - GARAGE_BUCKET_NAME
    networks:
      - app-network
    restart: "no"

volumes:
  garage_meta:
  garage_data:
