server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — sem cache para o index.html para refletir novas rotas imediatamente
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Cache para arquivos estáticos versionados (com hash)
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy para o backend .NET (sem expor a porta do .NET publicamente)
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy para o armazenamento de fotos de perfil servido via backend autenticado com o Garage S3
  # O modificador ^~ impede que a regra regex de imagens estáticas sobrescreva esta rota
  location ^~ /storage/ {
    proxy_pass http://backend:8080/api/profile/photo/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 300;
  }
}
